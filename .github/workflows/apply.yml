name: "Terraform Apply"
run-name: "Terraform Apply (${{ inputs.environment }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment directory under environments/ (e.g., test, production)"
        required: true
        type: choice
        options:
          - test
          - production
      plan_run_id:
        description: "Optional: Terraform Plan workflow run ID (main.yml). Leave blank to use the latest successful run on main."
        required: false
        type: string

permissions:
  contents: "read"
  actions: "read"

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: "ubuntu-latest"
    environment: "${{ inputs.environment }}"
    env:
      DIGITALOCEAN_TOKEN: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      TF_VAR_digitalocean_token: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      TF_VAR_ghcr_credentials: "${{ secrets.GHCR_CREDENTIALS }}"
      SPACES_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      SPACES_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_EC2_METADATA_DISABLED: "true"
    defaults:
      run:
        working-directory: "environments/${{ inputs.environment }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Resolve Plan Run ID"
        id: "resolve_plan"
        uses: "actions/github-script@v7"
        with:
          script: |
            const inputRunId = `${{ inputs.plan_run_id }}`.trim();
            const desiredArtifact = `tfplan-${{ inputs.environment }}`;

            const hasArtifact = async (runId) => {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(runId),
                per_page: 100,
              });
              return data.artifacts.some((artifact) => artifact.name === desiredArtifact);
            };

            if (inputRunId) {
              const ok = await hasArtifact(inputRunId);
              if (!ok) {
                core.setFailed(
                  `Run ${inputRunId} does not contain artifact '${desiredArtifact}'.`
                );
                return;
              }
              core.setOutput("run_id", inputRunId);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "main.yml",
              branch: "main",
              per_page: 20,
            });

            for (const run of data.workflow_runs) {
              if (run.conclusion !== "success") {
                continue;
              }
              if (await hasArtifact(run.id)) {
                core.setOutput("run_id", String(run.id));
                return;
              }
            }

            core.setFailed(
              `No successful Terraform Plan runs found for main.yml on the main branch with artifact '${desiredArtifact}'.`
            );


      - name: "Setup Terraform"
        uses: "hashicorp/setup-terraform@v3"
        with:
          terraform_version: "1.13.5"

      - name: "Download Plan Artifact"
        uses: "actions/download-artifact@v4"
        with:
          name: "tfplan-${{ inputs.environment }}"
          run-id: "${{ steps.resolve_plan.outputs.run_id }}"
          path: "environments/${{ inputs.environment }}"

      - name: "Verify Backend Credentials"
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Missing AWS credentials for the S3 backend. Ensure SPACES_ACCESS_KEY_ID and SPACES_SECRET_ACCESS_KEY are set as secrets for the selected environment."
            exit 1
          fi
          if [ -z "${DIGITALOCEAN_TOKEN}" ]; then
            echo "Missing DIGITALOCEAN_TOKEN. Ensure the secret is set for the selected environment."
            exit 1
          fi

      - name: "Terraform Init"
        run: "terraform init -input=false"

      - name: "Terraform Apply"
        run: "terraform apply -input=false -auto-approve tfplan"
