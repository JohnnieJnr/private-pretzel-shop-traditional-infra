name: "Terraform Plan"
run-name: "Terraform Plan (test + production)"

on:
  push:
    branches:
      - main

permissions:
  contents: "read"
  actions: "write"

jobs:
  plan:
    name: "Terraform Plan (${{ matrix.environment }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        environment:
          - test
          - production
    environment: "${{ matrix.environment }}"
    env:
      DIGITALOCEAN_TOKEN: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      TF_VAR_digitalocean_token: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      TF_VAR_ghcr_credentials: "${{ secrets.GHCR_CREDENTIALS }}"
      SPACES_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      SPACES_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_EC2_METADATA_DISABLED: "true"
    defaults:
      run:
        working-directory: "environments/${{ matrix.environment }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Terraform"
        uses: "hashicorp/setup-terraform@v3"
        with:
          terraform_version: "1.13.5"

      - name: "Verify Backend Credentials"
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Missing AWS credentials for the S3 backend. Ensure SPACES_ACCESS_KEY_ID and SPACES_SECRET_ACCESS_KEY are set as secrets for the selected environment."
            exit 1
          fi
          if [ -z "${DIGITALOCEAN_TOKEN}" ]; then
            echo "Missing DIGITALOCEAN_TOKEN. Ensure the secret is set for the selected environment."
            exit 1
          fi
      - name: "Terraform Init"
        run: "terraform init -input=false"

      - name: "Terraform Plan"
        run: "terraform plan -input=false -out=tfplan"

      - name: "Render Plan"
        run: "terraform show -no-color tfplan > plan.txt"

      - name: "Post Plan Summary"
        run: |
          echo "## Terraform Plan (${{ matrix.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact name: tfplan-${{ matrix.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload Plan Artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "tfplan-${{ matrix.environment }}"
          path: |
            environments/${{ matrix.environment }}/tfplan
            environments/${{ matrix.environment }}/plan.txt
          if-no-files-found: "error"
