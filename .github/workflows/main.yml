name: "Terraform Plan"
run-name: "Terraform Plan (test + production)"

on:
  push:
    branches:
      - main

permissions:
  contents: "read"
  actions: "write"

jobs:
  trivy-matrix:
    name: "Build Trivy Matrix"
    runs-on: "ubuntu-latest"
    outputs:
      matrix: "${{ steps.build.outputs.matrix }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"

      - name: "Build Matrix"
        id: "build"
        run: |
          matrix="$(python3 .github/utils/build_trivy_matrix.py)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${matrix}"

  trivy-iac:
    name: "Trivy IaC Scan (${{ matrix.label }})"
    runs-on: "ubuntu-latest"
    needs: "trivy-matrix"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.trivy-matrix.outputs.matrix) }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Trivy Scan (${{ matrix.scan_ref }})"
        id: "trivy_scan"
        uses: "aquasecurity/trivy-action@0.20.0"
        with:
          scan-type: "config"
          scan-ref: "${{ matrix.scan_ref }}"
          severity: "HIGH,CRITICAL"
          format: "json"
          output: "trivy-${{ matrix.kind }}-${{ matrix.name }}.json"
          exit-code: "0"

      - name: "Annotate Trivy Results (${{ matrix.scan_ref }})"
        id: "trivy_results"
        if: "always()"
        run: |
          report="trivy-${{ matrix.kind }}-${{ matrix.name }}.json"
          count="$(jq '[.Results[]?.Misconfigurations[]?] | length' "${report}")"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -gt 0 ]; then
            echo "::error title=Trivy IaC Violations::Directory ${{ matrix.scan_ref }} has ${count} HIGH/CRITICAL violations."
          else
            echo "::notice title=Trivy IaC Scan::Directory ${{ matrix.scan_ref }} has ${count} HIGH/CRITICAL violations."
          fi

      - name: "Fail on Trivy Violations"
        if: "always()"
        run: |
          if [ "${{ steps.trivy_results.outputs.count }}" -gt 0 ]; then
            exit 1
          fi

  plan:
    name: "Terraform Plan (${{ matrix.environment }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        environment:
          - test
          - production
    environment: "${{ matrix.environment }}"
    env:
      DIGITALOCEAN_TOKEN: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      TF_VAR_digitalocean_token: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      TF_VAR_ghcr_credentials: "${{ secrets.GHCR_CREDENTIALS }}"
      SPACES_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      SPACES_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_EC2_METADATA_DISABLED: "true"
    defaults:
      run:
        working-directory: "environments/${{ matrix.environment }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Terraform"
        uses: "hashicorp/setup-terraform@v3"
        with:
          terraform_version: "1.13.5"

      - name: "Verify Backend Credentials"
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Missing AWS credentials for the S3 backend. Ensure SPACES_ACCESS_KEY_ID and SPACES_SECRET_ACCESS_KEY are set as secrets for the selected environment."
            exit 1
          fi
          if [ -z "${DIGITALOCEAN_TOKEN}" ]; then
            echo "Missing DIGITALOCEAN_TOKEN. Ensure the secret is set for the selected environment."
            exit 1
          fi
      - name: "Verify Production Domain"
        if: "${{ matrix.environment == 'production' }}"
        env:
          DOMAIN: "${{ vars.DOMAIN }}"
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "Missing DOMAIN for production. Set a GitHub environment variable named DOMAIN on the production environment."
            exit 1
          fi
      - name: "Terraform Init"
        run: "terraform init -input=false"

      - name: "Terraform Plan (test)"
        if: "${{ matrix.environment != 'production' }}"
        run: "terraform plan -input=false -out=tfplan"

      - name: "Terraform Plan (production)"
        if: "${{ matrix.environment == 'production' }}"
        env:
          TF_VAR_domain: "${{ vars.DOMAIN }}"
        run: "terraform plan -input=false -out=tfplan"

      - name: "Render Plan"
        run: "terraform show -no-color tfplan > plan.txt"

      - name: "Post Plan Summary"
        run: |
          echo "## Terraform Plan (${{ matrix.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan run ID: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact name: tfplan-${{ matrix.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload Plan Artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "tfplan-${{ matrix.environment }}"
          path: |
            environments/${{ matrix.environment }}/tfplan
            environments/${{ matrix.environment }}/plan.txt
          if-no-files-found: "error"

  annotate:
    name: "Annotate Run ID"
    runs-on: "ubuntu-latest"
    needs: "plan"
    steps:
      - name: "Post Workflow Run ID Annotation"
        run: |
          echo "::notice title=Terraform Plan Run ID::${{ github.run_id }}"
