name: "Terraform Plan"
run-name: "Terraform Plan (${{ inputs.environment }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment directory under environments/ (e.g., test, production)"
        required: true
        default: "test"

permissions:
  contents: "read"
  actions: "write"

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: "ubuntu-latest"
    environment: "${{ inputs.environment }}"
    env:
      TF_VAR_digitalocean_token: "${{ secrets.DIGITALOCEAN_TOKEN }}"
      TF_VAR_ghcr_credentials: "${{ secrets.GHCR_CREDENTIALS }}"
      SPACES_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      SPACES_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_ACCESS_KEY_ID: "${{ secrets.SPACES_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "${{ secrets.SPACES_SECRET_ACCESS_KEY }}"
      AWS_REGION: "us-east-1"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_EC2_METADATA_DISABLED: "true"
    defaults:
      run:
        working-directory: "environments/${{ inputs.environment }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Setup Terraform"
        uses: "hashicorp/setup-terraform@v3"
        with:
          terraform_version: "1.13.5"

      - name: "Verify Backend Credentials"
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Missing AWS credentials for the S3 backend. Ensure SPACES_ACCESS_KEY_ID and SPACES_SECRET_ACCESS_KEY are set as secrets for the selected environment."
            exit 1
          fi
      - name: "Terraform Init"
        run: "terraform init -input=false"

      - name: "Terraform Plan"
        run: "terraform plan -input=false -out=tfplan"

      - name: "Render Plan"
        run: "terraform show -no-color tfplan > plan.txt"

      - name: "Upload Plan Artifact"
        uses: "actions/upload-artifact@v4"
        with:
          name: "tfplan-${{ inputs.environment }}"
          path: |
            environments/${{ inputs.environment }}/tfplan
            environments/${{ inputs.environment }}/plan.txt
          if-no-files-found: "error"
